<style>
:root{
  /* layout: a truck-art framed stage of seven players on top, four colour-coded sound shelves below. One visual world, single theme. */
  --ink:#170e33; --panel:#2a1b57; --line:#4b3a8a; --chuna:#fff4dc;
  --haldi:#ffc21a; --rani:#ff3d86; --mor:#12c2b0; --sindoor:#ff6a2b;
  --display:'Yatra One','Hind Madurai',system-ui,sans-serif;
  --body:'Hind Madurai',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--chuna);font-family:var(--body);font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--chuna);outline-offset:2px}
.app{max-width:900px;margin:0 auto;padding:12px 16px 28px;display:flex;flex-direction:column;gap:14px;min-height:100%}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,52px);line-height:.95;margin:0;color:var(--haldi);letter-spacing:.5px;
   text-shadow:2px 2px 0 var(--rani),4px 4px 0 var(--ink),5px 5px 0 var(--mor)}
.tag{margin:6px 0 0;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mor);font-weight:700}
.packs{display:flex;border:2px solid var(--haldi);border-radius:999px;overflow:hidden;background:var(--panel)}
.packs button{border:0;background:none;padding:8px 14px;font-weight:700;font-size:14px}
.packs button[aria-pressed="true"]{background:var(--haldi);color:var(--ink)}

/* stage */
.stage{position:relative;border-radius:14px;overflow:hidden;margin:11px;padding:34px 6px 40px;
  background:radial-gradient(120% 90% at 50% 40%,#3b2380 0%,#24145a 55%,#170e33 100%);
  box-shadow:0 0 0 4px var(--haldi),0 0 0 8px var(--rani),0 0 0 11px var(--mor)}
#art{position:absolute;inset:0;width:100%;height:100%;opacity:.5;transition:transform .12s ease-out}
.stage.beat #art{transform:scale(1.035)}
.toran{position:absolute;top:0;left:0;width:100%;height:30px}
.warli{position:absolute;bottom:0;left:0;width:100%;height:34px;background:#8a3a1c;border-top:2px solid var(--haldi)}
.warli .w{transition:transform .09s ease-out}
.stage.beat .warli .w:nth-child(odd){transform:translateY(-3px)}
.stage:not(.beat) .warli .w:nth-child(even){transform:translateY(-3px)}
.band{position:relative;display:flex;flex-wrap:wrap;justify-content:center}
.slot{position:relative;flex:0 0 14.28%;max-width:14.28%;display:flex;flex-direction:column;align-items:center}
.slot .who{border:0;background:none;padding:0;width:100%;display:flex;flex-direction:column;align-items:center;border-radius:10px}
.slot svg{width:100%;max-width:118px;height:auto;display:block;transform-origin:50% 100%;transition:transform .07s ease-out}
.slot.hit svg{transform:scale(1.07,.93)}
.slot .mo{display:none}.slot.hit .mo{display:block}.slot.hit .mc{display:none}
.slot.muted svg{filter:grayscale(1) brightness(.7)}
.slot.drop .who{background:rgba(255,194,26,.25)}
.slot .nm{font-size:11px;font-weight:700;line-height:1.15;text-align:center;min-height:26px;padding:2px 2px 0;color:var(--chuna)}
.slot:not(.on) .nm{color:#9d90cf;font-weight:400}
.slot .x{position:absolute;top:0;right:4%;width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);background:var(--chuna);color:var(--ink);font-size:13px;font-weight:700;line-height:1;padding:0;display:none}
.slot.on .x{display:block}
.slot .mt{position:absolute;top:26%;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--chuna);font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;display:none;letter-spacing:.08em}
.slot.muted .mt{display:block}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.banner{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:16px;background:rgba(23,14,51,.45)}
.banner.show{display:flex}
.banner b{font-family:var(--display);font-weight:400;font-size:clamp(30px,9vw,64px);line-height:1;color:var(--haldi);transform:rotate(-4deg);text-shadow:3px 3px 0 var(--rani),6px 6px 0 var(--ink);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.banner span{margin-top:14px;font-weight:700;background:var(--chuna);color:var(--ink);padding:4px 12px;border-radius:6px;font-size:14px}
@keyframes pop{from{transform:rotate(-4deg) scale(.3)}to{transform:rotate(-4deg) scale(1)}}

/* controls */
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.play{border:3px solid var(--ink);background:var(--haldi);color:var(--ink);font-family:var(--display);font-size:20px;padding:8px 22px;border-radius:999px;box-shadow:0 4px 0 var(--rani);min-width:118px}
.play:active{transform:translateY(3px);box-shadow:0 1px 0 var(--rani)}
.btn{border:2px solid var(--line);background:var(--panel);padding:8px 12px;border-radius:999px;font-weight:600;font-size:13.5px}
.btn:hover{border-color:var(--chuna)}
.btn.rec[aria-pressed="true"]{background:#e0122f;border-color:#e0122f}
.hint{margin:0;font-size:13px;color:#c9bdf2}
[hidden]{display:none!important}

/* trophies */
.troph{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tro{border:2px dashed var(--line);border-radius:10px;padding:6px 6px;text-align:center;font-size:11.5px;line-height:1.2;color:#b3a6e6;min-height:54px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.tro i{font-style:normal;font-size:17px;letter-spacing:1px}
.tro.got{border-style:solid;border-color:var(--haldi);background:var(--haldi);color:var(--ink);font-weight:700}

/* tray */
.tray{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.tray{grid-template-columns:1fr 1fr}}
.grp h2{margin:0 0 5px;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--c)}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;border:2px solid var(--c);background:var(--panel);border-radius:12px;padding:6px 2px 5px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;min-width:0}
.chip i{font-style:normal;font-size:23px;line-height:1.1}
.chip span{font-size:10px;line-height:1.12;font-weight:600;text-align:center;overflow-wrap:break-word;max-width:100%}
.chip.on{background:var(--c);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.ghost{position:fixed;z-index:50;pointer-events:none;font-size:40px;transform:translate(-50%,-60%);filter:drop-shadow(0 4px 0 rgba(0,0,0,.4))}

/* share sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,5,26,.8);display:none;align-items:center;justify-content:center;padding:16px}
.sheet.show{display:flex}
.card{background:var(--panel);border:3px solid var(--haldi);border-radius:16px;max-width:440px;width:100%;max-height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0;color:var(--haldi);text-wrap:balance;line-height:1.1}
.card canvas{width:100%;max-width:230px;height:auto;border-radius:8px;align-self:center}
.card p{margin:0;font-size:13px;color:#d6cdf5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--ink);padding:6px 10px;border-radius:8px;font-size:14px;letter-spacing:.05em}
.card input{flex:1;min-width:0;background:var(--ink);border:2px solid var(--line);border-radius:999px;color:var(--chuna);padding:8px 12px;font:inherit;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;background:var(--chuna);color:var(--ink);font-weight:700;padding:9px 14px;border-radius:999px;font-size:13.5px;display:none;align-items:center;gap:10px;max-width:calc(100% - 32px);box-shadow:0 4px 0 var(--rani)}
.toast.show{display:flex}
.toast button{border:2px solid var(--ink);background:var(--haldi);border-radius:999px;padding:3px 10px;font-weight:700;color:var(--ink)}

@media(max-width:560px){
  .slot{flex-basis:25%;max-width:25%}
  .slot svg{max-width:92px}
}
@media(prefers-reduced-motion:reduce){
  .slot svg,#art,.warli .w{transition:none}
  .slot.hit svg,.stage.beat #art{transform:none}
  .banner b{animation:none}
}
</style>

</div>
<div class="toast" id="toast" role="status"><span id="toastmsg"></span><button id="toastbtn" hidden></button></div>

<script>
"use strict";
const _sent={};
function track(name,data,once){try{if(once){if(_sent[name])return;_sent[name]=1;}window.va&&window.va('event',{name:name,data:data||{}});}catch(e){}}
(function(){try{const now=Date.now(),first=+localStorage.getItem('dd-first')||0,last=+localStorage.getItem('dd-last')||0;
  if(!first)localStorage.setItem('dd-first',now);
  else if(now-last>6*3600e3){const d=Math.floor((now-first)/864e5);track('return_visit',{days:d>=7?'7+':d>=1?'1-6':'0'});}
  localStorage.setItem('dd-last',now);}catch(e){}})();
/* ============ AUDIO ENGINE: everything is synthesised, no samples ============ */
let ac=null,master,comp,revSend,recDest,noiseBuf,bus=[],rsend=[];
const VOW={a:[800,1200,2500],e:[450,1900,2550],i:[300,2300,3000],o:[450,800,2500],u:[325,700,2500],m:[250,1000,2200]};
function initAudio(){
  if(ac){ if(ac.state==='suspended') ac.resume(); return; }
  ac=new (window.AudioContext||window.webkitAudioContext)();
  comp=ac.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=6; comp.attack.value=.004; comp.release.value=.2;
  master=ac.createGain(); master.gain.value=.75; master.connect(comp); comp.connect(ac.destination);
  try{ recDest=ac.createMediaStreamDestination(); comp.connect(recDest); }catch(e){ recDest=null; }
  noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);
  const nd=noiseBuf.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
  const len=Math.floor(ac.sampleRate*1.5), ir=ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){ const d=ir.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); }
  const conv=ac.createConvolver(); conv.buffer=ir;
  revSend=ac.createGain(); revSend.gain.value=.5; revSend.connect(conv); conv.connect(master);
  for(let i=0;i<7;i++){
    const b=ac.createGain(); b.connect(master);
    const r=ac.createGain(); r.gain.value=0; b.connect(r); r.connect(revSend);
    bus.push(b); rsend.push(r);
  }
  syncBuses();
}
function G(t,peak,a,d){const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);return g;}
function GS(t,peak,a,dur,r){const g=ac.createGain(),h=Math.max(a+.005,dur);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.setValueAtTime(peak,t+h);g.gain.linearRampToValueAtTime(.0001,t+h+r);return g;}
function O(type,f,t,stop){const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.start(t);o.stop(stop);return o;}
function N(t,stop){const s=ac.createBufferSource();s.buffer=noiseBuf;s.loop=true;s.start(t,Math.random());s.stop(stop);return s;}
function F(type,f,q){const b=ac.createBiquadFilter();b.type=type;b.frequency.value=f;if(q!=null)b.Q.value=q;return b;}
function K(v){const g=ac.createGain();g.gain.value=v;return g;}
function chain(){for(let i=0;i<arguments.length-1;i++)arguments[i].connect(arguments[i+1]);}
function vib(os,rate,depth,t0,stop){const l=O('sine',rate,t0,stop),g=K(depth);l.connect(g);g.connect(os.frequency);}

const V={
  kick(t,o,v,f0,f1,d){const os=O('sine',f0,t,t+d+.05);os.frequency.exponentialRampToValueAtTime(f1,t+.09);chain(os,G(t,v,.002,d),o);},
  tak(t,o,v,f,d){d=d||.07;chain(N(t,t+d+.02),F('bandpass',f*2.2,1.2),G(t,v,.001,d),o);chain(O('triangle',f,t,t+d+.01),G(t,v*.5,.001,d*.7),o);},
  na(t,o,v,f,d){d=d||.22;chain(O('sine',f,t,t+d+.02),G(t,v,.001,d),o);chain(O('sine',f*2.02,t,t+d),G(t,v*.35,.001,d*.5),o);chain(N(t,t+.04),F('highpass',3000),G(t,v*.4,.001,.02),o);},
  ge(t,o,v,f,up,d){f=f||85;up=up||1.5;d=d||.35;const os=O('sine',f,t,t+d+.05);os.frequency.linearRampToValueAtTime(f*up,t+.11);os.frequency.linearRampToValueAtTime(f*1.1,t+d);chain(os,G(t,v,.004,d),o);chain(O('triangle',f*2,t,t+.12),G(t,v*.3,.002,.09),o);},
  ghat(t,o,v,f){chain(O('triangle',f,t,t+.15),G(t,v,.001,.11),o);chain(N(t,t+.06),F('bandpass',1500,2),G(t,v*.5,.001,.035),o);},
  hiss(t,o,v,d){chain(N(t,t+d+.02),F('highpass',7000),G(t,v,.001,d),o);},
  cooker(t,o,v,d){const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+d*.6);g.gain.exponentialRampToValueAtTime(.0001,t+d);const b=F('bandpass',2600,6);b.frequency.setValueAtTime(2600,t);b.frequency.linearRampToValueAtTime(3600,t+d*.7);chain(N(t,t+d+.02),b,g,o);const os=O('sine',2600,t,t+d+.02);os.frequency.linearRampToValueAtTime(3600,t+d*.7);chain(os,K(.12),g);},
  steel(t,o,v,f){[1,2.76,5.4].forEach((m,i)=>chain(O('sine',f*m,t,t+.22),G(t,v/(i+1),.001,.13/(i+1)+.03),o));},
  clap(t,o,v){[0,.012,.026].forEach(dt=>chain(N(t+dt,t+dt+.14),F('bandpass',1400,1.4),G(t+dt,v,.001,dt>.02?.11:.02),o));},
  pluck(t,o,f,d,v,type,br,bend){const os=O(type||'sawtooth',f*(1+(bend||0)),t,t+d+.05);if(bend)os.frequency.exponentialRampToValueAtTime(f,t+.09);const top=Math.min(f*(br||7),12000),lp=F('lowpass',top,2);lp.frequency.setValueAtTime(top,t);lp.frequency.exponentialRampToValueAtTime(Math.max(f*1.2,200),t+d);chain(os,lp,G(t,v,.003,d),o);},
  reed(t,o,f,d,v,from){const os=O('sawtooth',from||f,t,t+d+.12);if(from)os.frequency.exponentialRampToValueAtTime(f,t+.07);vib(os,5.5,f*.012,t+.1,t+d+.12);const g=GS(t,v,.03,d,.06);[[1150,5,1],[2700,6,.6]].forEach(a=>{const b=F('bandpass',a[0],a[1]);chain(os,b,K(a[2]),g);});g.connect(o);},
  brass(t,o,f,d,v){const lp=F('lowpass',400,1);lp.frequency.setValueAtTime(400,t);lp.frequency.linearRampToValueAtTime(3200,t+.04);lp.frequency.linearRampToValueAtTime(1200,t+d+.06);const g=GS(t,v,.02,d,.07);[1,1.006,.5,1.5].forEach((m,i)=>chain(O('sawtooth',f*m,t,t+d+.12),K(i<2?.5:.25),lp));chain(lp,g,o);},
  flute(t,o,f,d,v,from){const os=O('sine',from||f,t,t+d+.15);if(from)os.frequency.exponentialRampToValueAtTime(f,t+.06);vib(os,5,f*.008,t+.08,t+d+.15);const g=GS(t,v,.04,d,.1);os.connect(g);chain(O('triangle',f*2,t,t+d+.15),K(.1),g);chain(N(t,t+d+.1),F('bandpass',f*2,3),K(.1),g);g.connect(o);},
  pad(t,o,fs,d,v){const lp=F('lowpass',1900,.7),g=GS(t,v,.03,d,.09);fs.forEach(f=>{[['sawtooth',1,.6],['square',2,.2]].forEach(a=>{const os=O(a[0],f*a[1],t,t+d+.14);os.detune.value=(Math.random()-.5)*10;chain(os,K(a[2]),lp);});});chain(lp,g,o);},
  putt(t,o,f,d,v){const os=O('sawtooth',f,t,t+d+.06),lp=F('lowpass',620,3),am=K(.55),l=O('square',24,t,t+d+.06);chain(l,K(.45),am.gain);chain(os,lp,am,GS(t,v,.005,d,.04),o);},

/* ============ SEQUENCER ============ */
function stepTime(s){return t0+s*pack.sd+((s&1)?pack.sw*pack.sd:0);}
function tick(){
  if(!playing)return;
  while(stepTime(stepIdx)<ac.currentTime+.13){
    const t=stepTime(stepIdx);
    for(let i=0;i<7;i++){
      if(slots[i]<0)continue;
      const hit=pack.sounds[slots[i]][6](stepIdx,t,bus[i],pack);
      if(hit&&!muted[i])vq.push({t:t,s:i});
    }
    if(stepIdx%(pack.bar/4)===0)vq.push({t:t,b:1});
    stepIdx++;
  }
}
function syncBuses(){
  if(!ac)return;
  for(let i=0;i<7;i++){
    bus[i].gain.setTargetAtTime(muted[i]||slots[i]<0?0:1,ac.currentTime,.015);
    rsend[i].gain.setTargetAtTime(slots[i]<0?0:pack.sounds[slots[i]][5],ac.currentTime,.015);
  }
}
function play(){
  initAudio();
  if(playing)return;
  playing=true;t0=ac.currentTime+.08;stepIdx=0;vq=[];
  timer=setInterval(tick,25);tick();
  $('play').textContent=pack.ui.pause;
  requestAnimationFrame(frame);
  track('first_play',{pack:pack.key},true);
  checkCombos();
}
function pause(){
  playing=false;clearInterval(timer);vq=[];
  $('play').textContent=pack.ui.play;
}
let beatFlip=false;
function frame(){
  if(!playing)return;
  const now=ac.currentTime;
  while(vq.length&&vq[0].t<=now+.015){
    const e=vq.shift();
    if(e.b){beatFlip=!beatFlip;$('stage').classList.toggle('beat',beatFlip);}
    else{const el=slotEls[e.s];el.classList.add('hit');clearTimeout(el._h);el._h=setTimeout(()=>el.classList.remove('hit'),110);}
  }
  requestAnimationFrame(frame);
}

let slotEls=[];

    d.innerHTML=`<button class="who" id="who${i}"></button><span class="mt"></span><button class="x" id="x${i}" aria-label="Remove">✕</button>`;

}
function renderSlot(i){

}
function renderAll(){

  syncBuses();
}
function setSlot(i,idx){
  if(idx>=0){const prev=slots.indexOf(idx);if(prev>=0&&prev!==i){slots[prev]=-1;muted[prev]=0;}}
  slots[i]=idx;muted[i]=0;renderAll();checkCombos();
  if(idx>=0){_adds++;if(_adds===5)track('engaged_5_sounds',{pack:pack.key},true);}
}
function toggleSound(idx){
  const at=slots.indexOf(idx);
  if(at>=0){setSlot(at,-1);return;}
  let free=slots.indexOf(-1);
  if(free<0){toast(pack.key==='h'?'Stage full hai. Kisi ko hatao.':'Stage full. Yaaraiyaavadhu eduthudu.');return;}
  setSlot(free,idx);
  if(!playing)play();

/* ============ FOLK ART BACKDROP ============ */
function drawArt(){
  const cv=$('art'),r=cv.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
  if(!r.width)return;
  cv.width=r.width*dpr;cv.height=r.height*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);
  const cx=r.width/2,cy=r.height/2,R=Math.min(r.width*.46,r.height*.62);
  if(pack.key==='h'){ /* rangoli: rings of petals */
    const cols=['#ff3d86','#ffc21a','#12c2b0','#ff6a2b','#fff4dc'];
    for(let ring=5;ring>=1;ring--){
      const n=8*Math.min(ring,3),rr=R*ring/5,pl=R/5*1.15,pw=Math.PI*rr/n*.8;
      for(let k=0;k<n;k++){const a=k/n*Math.PI*2+(ring%2?0:Math.PI/n);
        c.save();c.translate(cx+Math.cos(a)*rr*.8,cy+Math.sin(a)*rr*.8);c.rotate(a);
        c.beginPath();c.moveTo(0,-pw/2);c.quadraticCurveTo(pl,0,0,pw/2);c.quadraticCurveTo(-pl*.35,0,0,-pw/2);
        c.fillStyle=cols[(ring+k)%2?ring%5:(ring+2)%5];c.globalAlpha=.75;c.fill();c.globalAlpha=1;c.strokeStyle='#fff4dc';c.lineWidth=1;c.stroke();c.restore();}
    }
    c.beginPath();c.arc(cx,cy,R*.09,0,7);c.fillStyle='#ffc21a';c.fill();
    for(let k=0;k<12;k++){const a=k/12*Math.PI*2;c.beginPath();c.arc(cx+Math.cos(a)*R*.14,cy+Math.sin(a)*R*.14,R*.018,0,7);c.fillStyle='#fff4dc';c.fill();}
  }else{ /* kolam: dots in a diamond with loops woven around them */
    const rows=[1,3,5,7,9,7,5,3,1],g=Math.min(R*2/9,r.height/9.5);
    c.strokeStyle='#fff4dc';c.fillStyle='#fff4dc';c.lineWidth=2;c.lineJoin='round';
    rows.forEach((n,ri)=>{for(let k=0;k<n;k++){
      const x=cx+(k-(n-1)/2)*g,y=cy+(ri-4)*g;
      c.beginPath();c.arc(x,y,2.4,0,7);c.fill();
      const s=g*.5;c.beginPath();c.moveTo(x,y-s);c.quadraticCurveTo(x+s*.9,y-s*.9,x+s,y);c.quadraticCurveTo(x+s*.9,y+s*.9,x,y+s);c.quadraticCurveTo(x-s*.9,y+s*.9,x-s,y);c.quadraticCurveTo(x-s*.9,y-s*.9,x,y-s);
      if((ri+k)%2===0)c.stroke();
      else{c.save();c.translate(x,y);c.rotate(Math.PI/4);c.strokeRect(-s*.62,-s*.62,s*1.24,s*1.24);c.restore();}
    }});
  }
}

function checkCombos(){
  if(!playing)return;
  const live=slots.map((s,i)=>s>=0&&!muted[i]?pack.sounds[s][0]:null);
  pack.combos.forEach(cb=>{
    const ok=cb.need.every(id=>live.indexOf(id)>=0),k=pack.key+cb.id;
    if(ok&&!comboOn[k]){comboOn[k]=1;fire(cb);}
    if(!ok)comboOn[k]=0;
  });
}

      const x=W+60-((el*W*.55)%(W+140)),y=H*.72+Math.abs(Math.sin(el*14))*-6;
      c.font=Math.min(H*.36,96)+'px serif';c.textAlign='center';c.fillText('🛺',x,y);
      if(acc>.05){acc=0;P.push({x:x+46,y:y-6,vx:40+Math.random()*40,vy:-20-Math.random()*20,l:.8,c:'rgba(255,244,220,.7)',r:5+Math.random()*5});}
    }else if(type==='eyes'){
      eyes.forEach(e=>{const o=Math.max(0,Math.min(1,(el-e.d)*4));if(!o)return;const blink=(Math.sin(el*3+e.x)>.96)?.15:1;
        [-1,1].forEach(sg=>{const ex=e.x+sg*e.s*1.15;c.beginPath();c.ellipse(ex,e.y,e.s*o,e.s*.62*o*blink,0,0,7);c.fillStyle='#fff';c.fill();c.strokeStyle=INK;c.lineWidth=2;c.stroke();
          const a=Math.atan2(H/2-e.y,W/2-ex);c.beginPath();c.arc(ex+Math.cos(a)*e.s*.35,e.y+Math.sin(a)*e.s*.2,e.s*.34*o*blink,0,7);c.fillStyle=INK;c.fill();});});
    }
    for(let i=P.length-1;i>=0;i--){const p=P[i];p.l-=dt;if(p.l<=0||p.y>H+20){P.splice(i,1);continue;}
      p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.rain&&!p.p&&!p.rect)p.vy+=120*dt;
      c.globalAlpha=Math.min(1,p.l*1.5);
      if(p.rain){c.strokeStyle=p.c;c.lineWidth=1.5;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x+3,p.y-14);c.stroke();}
      else if(p.rect){p.a+=dt*8;c.save();c.translate(p.x,p.y);c.rotate(p.a);c.fillStyle=p.c;c.fillRect(-p.r,-p.r*.5,p.r*2,p.r);c.restore();}
      else{c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill();}
      c.globalAlpha=1;}
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

/* ============ SHARE ============ */
function mixCode(){return 'mix-'+pack.key+'-'+slots.map(s=>s<0?'x':s.toString(36)).join('');}
function parseCode(str){const m=/mix-([ht])-([0-9a-jx]{7})/i.exec(str||'');if(!m)return null;return {pack:m[1].toLowerCase(),slots:m[2].toLowerCase().split('').map(ch=>ch==='x'?-1:parseInt(ch,36))};}
function bandName(){
  let h=nameSeed*131+7;slots.forEach((s,i)=>{h=(h*31+(s+2)*(i+3))>>>0;});
  return pack.bandA[h%pack.bandA.length]+' '+pack.bandB[Math.floor(h/97)%pack.bandB.length];
}
function wrapText(c,text,x,y,maxW,lh){const words=text.split(' ');let line='',yy=y;words.forEach(w=>{const t=line?line+' '+w:w;if(c.measureText(t).width>maxW&&line){c.fillText(line,x,yy);line=w;yy+=lh;}else line=t;});c.fillText(line,x,yy);return yy+lh;}
function drawPoster(){
  const cv=$('poster'),c=cv.getContext('2d'),W=1080,H=1350;
  c.fillStyle=INK;c.fillRect(0,0,W,H);
  ['#12c2b0','#ff3d86','#ffc21a'].forEach((col,i)=>{c.strokeStyle=col;c.lineWidth=16;c.strokeRect(24+i*18,24+i*18,W-48-i*36,H-48-i*36);});
  for(let x=110;x<W-90;x+=44){c.beginPath();c.moveTo(x,96);c.lineTo(x+22,132);c.lineTo(x+44,96);c.closePath();c.fillStyle=(x/44|0)%2?'#ff6a2b':'#2fa84a';c.fill();}
  c.textAlign='center';c.fillStyle='#12c2b0';c.font='700 34px "Hind Madurai",sans-serif';c.fillText(pack.title.toUpperCase()+'  PRESENTS',W/2,220);
  c.font='92px "Yatra One","Hind Madurai",sans-serif';
  c.fillStyle='#ff3d86';let y=wrapText(c,bandName(),W/2+5,345,860,104);
  c.fillStyle='#ffc21a';wrapText(c,bandName(),W/2,340,860,104);
  const act=slots.map((s,i)=>s>=0?pack.sounds[s]:null).filter(Boolean);
  y=Math.max(y+30,700);
  const cols=Math.min(4,Math.max(1,act.length)),cw=860/cols;
  act.forEach((s,i)=>{const cx=110+cw*(i%cols)+cw/2,cy=y+Math.floor(i/cols)*230;
    c.beginPath();c.arc(cx,cy,74,0,7);c.fillStyle=GHEX[s[7]];c.fill();c.lineWidth=6;c.strokeStyle='#fff4dc';c.stroke();
    c.font='78px serif';c.fillStyle='#000';c.fillText(s[2],cx,cy+28);
    c.font='600 26px "Hind Madurai",sans-serif';c.fillStyle='#fff4dc';wrapText(c,s[1],cx,cy+116,cw-16,30);});
  c.fillStyle='#fff4dc';c.fillRect(110,H-212,860,84);
  c.fillStyle=INK;c.font='700 40px ui-monospace,Menlo,monospace';c.fillText(mixCode(),W/2,H-156);
  c.fillStyle='#12c2b0';c.font='700 28px "Hind Madurai",sans-serif';c.fillText(pack.key==='h'?'HORN OK PLEASE  ·  YE CODE DAALO, YE GAANA BAJAO':'SOUND HORN  ·  INDHA CODE PODU, INDHA PAATU KELU',W/2,H-92);
}
function captionText(){
  let s=pack.ui.cap(bandName(),mixCode());
  if(standalone&&/^https?:/.test(location.href))s+=' '+location.href.split('#')[0]+'#'+mixCode();
  return s;
}
function openShare(){
  track('share_open',{pack:pack.key});
  try{location.hash=mixCode();}catch(e){}
  $('bandname').textContent=bandName();$('mixcode').textContent=mixCode();
  $('sharehelp').textContent=standalone?'Copy the caption. It carries a link that opens this exact mix.':'Use Share at the top of this page and copy the link. It opens this exact mix. Friends can also paste the mix code below.';
  drawPoster();$('sheet').classList.add('show');$('closesheet').focus();
}
$('shr').addEventListener('click',()=>{(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(openShare);});
$('closesheet').addEventListener('click',()=>$('sheet').classList.remove('show'));
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))$('sheet').classList.remove('show');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('sheet').classList.remove('show');});
$('rename').addEventListener('click',()=>{nameSeed++;$('bandname').textContent=bandName();drawPoster();});
$('copycap').addEventListener('click',()=>{
  const txt=captionText();
  (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{toast('Caption copied');track('caption_copy',{pack:pack.key});}).catch(()=>toast('Copy blocked here. Mix code: '+mixCode()));
});
$('loadform').addEventListener('submit',e=>{
  e.preventDefault();const m=parseCode($('loadcode').value);
  if(!m){toast('That code does not look right. It should read like mix-h-0x7xax9');return;}
  loadMix(m);$('sheet').classList.remove('show');$('loadcode').value='';play();track('mix_load',{via:'code'});
});
function saveFile(filename,blob){
  if(dl)return dl.save({filename:filename,data:blob}).then(()=>toast('Saved')).catch(err=>{if(!err||err.code!=='declined')toast('Could not save here');});
  if(standalone){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
  return Promise.resolve();
}
$('saveposter').addEventListener('click',()=>{track('poster_save');$('poster').toBlob(b=>{if(b)saveFile('dhinchak-poster.png',b);},'image/png');});

/* ---- recording ---- */
let recBlob=null,recExt='webm',recorder=null;
function recType(){if(!window.MediaRecorder)return null;const c=[['audio/webm;codecs=opus','webm'],['audio/webm','webm'],['audio/mp4','mp4']];for(const x of c){try{if(MediaRecorder.isTypeSupported(x[0]))return x;}catch(e){}}return null;}
$('rec').addEventListener('click',()=>{
  if(recorder){recorder.stop();return;}
  initAudio();const ty=recType();
  if(!recDest||!ty){toast('Recording is not supported in this browser');return;}
  if(!playing)play();
  const chunks=[];recExt=ty[1];
  try{recorder=new MediaRecorder(recDest.stream,{mimeType:ty[0]});}catch(e){toast('Recording is not supported in this browser');return;}
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  recorder.onstop=()=>{recorder=null;$('rec').setAttribute('aria-pressed','false');$('rec').textContent=pack.ui.rec;
    recBlob=new Blob(chunks,{type:ty[0]});
    toast('Recording ready','Save',()=>{track('recording_save');return saveFile('dhinchak-mix.'+recExt,recBlob);},12000);};
  recorder.start();$('rec').setAttribute('aria-pressed','true');$('rec').textContent='Stop';
  const ms=(pack.L*2*pack.sd+.6)*1000,r=recorder;setTimeout(()=>{if(recorder===r)r.stop();},ms);
});
let toastT=0;
function toast(msg,btn,fn,ms){
  $('toastmsg').textContent=msg;const b=$('toastbtn');
  if(btn){b.hidden=false;b.textContent=btn;b.onclick=()=>{$('toast').classList.remove('show');fn();};}else{b.hidden=true;b.onclick=null;}
  $('toast').classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>$('toast').classList.remove('show'),ms||2600);
}
function saveUI(){const can=!!dl||standalone;$('saveposter').hidden=!can;$('rec').hidden=!(can&&recType());}

/* ============ PACK + BOOT ============ */
function setPack(k,keep){
  const was=playing;if(playing)pause();
  pack=PACKS[k];comboOn={};sceneRun++;$('banner').classList.remove('show');
  if(!keep){slots=pack.demo.slice();muted=[0,0,0,0,0,0,0];}
  document.documentElement.lang=pack.lang==='ta'?'en-IN':'en-IN';
  $('ttl').textContent=pack.title;$('tag').textContent=pack.tag;
  $('pk-h').setAttribute('aria-pressed',k==='h');$('pk-t').setAttribute('aria-pressed',k==='t');
  $('play').textContent=pack.ui.play;$('shuf').textContent=pack.ui.shuf;$('clr').textContent=pack.ui.clr;$('shr').textContent=pack.ui.shr;$('rec').textContent=pack.ui.rec;$('hint').textContent=pack.ui.hint;
  buildTray();buildTrophies();renderAll();drawArt();
  if(was)play();
}
function loadMix(m){
  if(!m||!PACKS[m.pack])return;
  const n=PACKS[m.pack].sounds.length,seen={};
  slots=m.slots.slice(0,7).map(s=>{if(!(s>=0&&s<n)||seen[s])return -1;seen[s]=1;return s;});
  while(slots.length<7)slots.push(-1);muted=[0,0,0,0,0,0,0];
  setPack(m.pack,true);
}
$('pk-h').addEventListener('click',()=>{if(pack.key!=='h')setPack('h');});
$('pk-t').addEventListener('click',()=>{if(pack.key!=='t'){setPack('t');track('pack_switch',{to:'t'});}});
$('play').addEventListener('click',()=>{playing?pause():play();});
$('clr').addEventListener('click',()=>{slots=[-1,-1,-1,-1,-1,-1,-1];muted=[0,0,0,0,0,0,0];renderAll();checkCombos();});
$('shuf').addEventListener('click',()=>{
  const pick=[];[0,0,1,2,2,3].forEach(g=>{const c=pack.sounds.map((s,i)=>i).filter(i=>pack.sounds[i][7]===g&&pick.indexOf(i)<0);pick.push(c[Math.floor(Math.random()*c.length)]);});
  if(Math.random()<.5)pick.push(pack.sounds.map((s,i)=>i).filter(i=>pick.indexOf(i)<0)[Math.floor(Math.random()*14)]);
  for(let i=pick.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pick[i],pick[j]]=[pick[j],pick[i]];}
  slots=[-1,-1,-1,-1,-1,-1,-1];pick.forEach((p,i)=>slots[i]=p);muted=[0,0,0,0,0,0,0];renderAll();
  if(!playing)play();else checkCombos();
});
window.addEventListener('hashchange',()=>{const m=parseCode(location.hash);if(m&&('mix-'+m.pack+'-'+m.slots.map(s=>s<0?'x':s.toString(36)).join(''))!==mixCode())loadMix(m);});
let rz=0;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{drawTrim();drawArt();},150);});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing&&!recorder)pause();});

/* tag every sound with its group index (five per shelf) */
Object.keys(PACKS).forEach(k=>PACKS[k].sounds.forEach((s,i)=>{s[7]=Math.floor(i/5);}));

function start(data){
  buildStage();drawTrim();
  const fromHash=parseCode(location.hash);
  if(fromHash){loadMix(fromHash);track('mix_load',{via:'link'});}
  else if(data&&data.pack&&PACKS[data.pack]&&Array.isArray(data.slots))loadMix({pack:data.pack,slots:data.slots});
  else setPack('h');
  saveUI();
  if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{dl=d;saveUI();}).catch(()=>{});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{drawTrim();drawArt();});
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>({pack:pack.key,slots:slots.slice()}));
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
</script>
